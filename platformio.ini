; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = bodmer/TFT_eSPI@^2.5.43

; -----------------------------------------------------------------------------
; TFT_eSPI configuration lives here, NOT in the library's User_Setup.h.
; -DUSER_SETUP_LOADED makes User_Setup_Select.h skip User_Setup.h entirely, so
; these flags are the single source of truth and survive a clean TFT_eSPI
; reinstall (which wipes User_Setup.h).
; -----------------------------------------------------------------------------
build_flags =
  -DUSER_SETUP_LOADED

  ; ESP32-S3: bind TFT_eSPI to an explicit, self-consistent SPI port. Without
  ; this the default 'spi = SPI' binding mismatches the driver register
  ; SPI_PORT and tft.init() panics (StoreProhibited) at boot -> reboot loop.
  -DUSE_HSPI_PORT

  ; Driver and panel geometry (ST7735 128x160, portrait)
  -DST7735_DRIVER
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_OFF

  ; BLACKTAB: this panel needs colstart=rowstart=0 in rotation 3. GreenTab
  ; leaves a (1,2) CGRAM offset that paints 1 dead column + 2 dead rows at the
  ; far edges. BLACKTAB uses the same rotation-3 MADCTL (orientation/colours
  ; unchanged) but zeroes the offset.
  -DST7735_BLACKTAB

  ; SPI pins (hardware SPI3 via USE_HSPI_PORT)
  -DTFT_MISO=1
  -DTFT_MOSI=42
  -DTFT_SCLK=41
  -DTFT_CS=40
  -DTFT_DC=39
  -DTFT_RST=38
  -DTOUCH_CS=-1

  ; SPI clocks (ST7735 is unreliable above 27 MHz)
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000

  ; Fonts (UI.cpp uses GFXFF FreeSans9pt7b -> LOAD_GFXFF is required)
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_FONT8N
  -DLOAD_GFXFF
  -DSMOOTH_FONT